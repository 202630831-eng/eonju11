<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>저주받은 알림장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Serif+KR:wght@300;600;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Serif KR', serif;
    }

    body {
      background-color: #030303;
      background-image: radial-gradient(circle at 50% 50%, #110202 0%, #000000 90%);
      color: #bfbfbf;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid #330000;
      border-radius: 4px;
      padding: 35px 25px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(80, 0, 0, 0.4);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Creepster', cursive;
      font-size: 28px;
      color: #8b0000;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 0 8px rgba(139, 0, 0, 0.8);
    }

    .image-uploader {
      margin-bottom: 20px;
      text-align: center;
      background: #110505;
      padding: 10px;
      border: 1px dashed #550000;
      border-radius: 4px;
    }

    .image-uploader label {
      font-size: 12px;
      color: #a87373;
      cursor: pointer;
      display: block;
      margin-bottom: 5px;
    }

    .image-uploader input {
      font-size: 11px;
      color: #888;
    }

    .step-view { display: none; }
    .step-view.active {
      display: block;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-dots {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #222;
      border: 1px solid #444;
      transition: all 0.5s;
    }

    .dot.active {
      background: #8b0000;
      border-color: #ff0000;
      box-shadow: 0 0 8px #ff0000;
    }

    label {
      font-size: 13px;
      color: #8a7373;
      display: block;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    textarea, input[type="time"] {
      width: 100%;
      background: #080808;
      border: 1px solid #2a0000;
      color: #d1b8b8;
      padding: 14px;
      font-size: 14px;
      border-radius: 2px;
      outline: none;
      margin-bottom: 25px;
      transition: border-color 0.3s;
    }

    textarea:focus, input[type="time"]:focus {
      border-color: #8b0000;
      box-shadow: 0 0 5px rgba(139, 0, 0, 0.5);
    }

    textarea { height: 110px; resize: none; line-height: 1.6; }

    .btn {
      width: 100%;
      padding: 16px;
      background: #1a0000;
      border: 1px solid #5a0000;
      color: #a33;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #330000;
      color: #ff4d4d;
      border-color: #ff0000;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
    }

    .btn-sub {
      background: transparent;
      border: 1px solid #222;
      color: #666;
      margin-top: 10px;
    }

    .btn-sub:hover {
      background: #111;
      color: #999;
      border-color: #444;
      box-shadow: none;
    }

    .preview-box {
      background: #050505;
      border-left: 2px solid #8b0000;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
    }

    .sms-box {
      background: #000;
      border: 1px solid #333;
      padding: 18px;
      font-size: 13px;
      color: #8b0000;
      line-height: 1.7;
      margin-top: 15px;
      letter-spacing: 0.5px;
    }

    /* =========================================
       점프스케어 레이어 (보내주신 사진 적용)
    ========================================= */
    #jumpscare-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 사진 확대를 통한 강렬한 곤충 점프스케어 모션 */
    .custom-monster-img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      animation: monsterZoom 0.04s infinite alternate;
    }

    @keyframes monsterZoom {
      0% { transform: scale(1.15) translate(-10px, 6px); }
      50% { transform: scale(1.35) translate(10px, -8px); }
      100% { transform: scale(1.2) translate(-5px, -10px); }
    }

    .screen-flash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #002244;
      opacity: 0;
      z-index: 100000;
      pointer-events: none;
    }

    .flash-anim { animation: blueFlash 0.35s ease-out; }

    @keyframes blueFlash {
      0% { opacity: 0.8; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body onclick="playDoorSoundOnce()">

  <!-- 음향 효과: 오래된 문 소리만 사용 -->
  <audio id="doorSound" src="https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3" preload="auto"></audio>

  <div id="flash-layer" class="screen-flash"></div>

  <!-- 이미지 오버레이 레이어 -->
  <div id="jumpscare-overlay">
    <!-- 기본 파일명: ant-face.jpg (보내주신 이미지를 ant-face.jpg로 저장하거나 파일 첨부 기능을 이용하세요) -->
    <img id="jumpscareImg" class="custom-monster-img" src="ant-face.jpg" alt="Ant Face Jumpscare">
  </div>

  <div class="card">
    <h1>THE REMINDER</h1>

    <!-- 사진 변경용 커스텀 업로더 -->
    <div class="image-uploader">
      <label for="imgInput">📁 튀어나올 이미지 파일 직접 선택 (클릭)</label>
      <input type="file" id="imgInput" accept="image/*" onchange="loadCustomImage(event)">
    </div>

    <div class="step-dots">
      <div class="dot active" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <!-- 1단계 -->
    <div class="step-view active" id="step1">
      <label>알림장 텍스트를 입력하십시오.</label>
      <textarea id="kakaoText" placeholder="예: [알림장] 내일 준비물: 미술 붓, 8색 물감..."></textarea>
      <button class="btn" onclick="triggerJumpscareAndNext(2)">다음 단계로 이동</button>
    </div>

    <!-- 2단계 -->
    <div class="step-view" id="step2">
      <label>인식된 준비물 목록</label>
      <div class="preview-box">
        <span id="parsedItems">8색 수채화 물감, 붓 set, 4절 도화지</span>
      </div>
      <label>알림 발송 시각</label>
      <input type="time" id="alarmTime" value="20:00">
      <button class="btn" onclick="triggerJumpscareAndNext(3)">알림 설정 확정</button>
      <button class="btn btn-sub" onclick="triggerJumpscareAndNext(1)">이전 단계</button>
    </div>

    <!-- 3단계 -->
    <div class="step-view" id="step3">
      <label>알림 설정이 완료되었습니다.</label>
      <div class="sms-box">
[알림]
당신이 내일 챙겨야 할 준비물입니다.

- 8색 수채화 물감
- 붓 set
- 4절 도화지

절대 잊지 마십시오.
      </div>
      <button class="btn" style="margin-top: 25px;" onclick="triggerJumpscareAndNext(1)">처음으로 돌아가기</button>
    </div>
  </div>

  <script>
    let currentStep = 1;
    let doorPlayed = false;

    // 이미지 로컬 업로드 처리
    function loadCustomImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('jumpscareImg').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // 오래된 문 소리
    function playDoorSoundOnce() {
      if (!doorPlayed) {
        const door = document.getElementById('doorSound');
        door.volume = 0.5;
        door.play().catch(e => {});
        doorPlayed = true;
      }
    }

    // 버튼 클릭 시 지정한 이미지가 확 튀어나오는 함수
    function triggerJumpscareAndNext(targetStep) {
      const overlay = document.getElementById('jumpscare-overlay');
      const flash = document.getElementById('flash-layer');
      const door = document.getElementById('doorSound');

      // 번쩍임 및 얼굴 등장
      flash.classList.add('flash-anim');
      overlay.style.display = 'flex';

      setTimeout(() => {
        overlay.style.display = 'none';
        flash.classList.remove('flash-anim');

        // 단계 전환
        document.getElementById('step' + currentStep).classList.remove('active');
        document.getElementById('dot' + currentStep).classList.remove('active');

        currentStep = targetStep;

        document.getElementById('step' + currentStep).classList.add('active');
        document.getElementById('dot' + currentStep).classList.add('active');

        if (targetStep === 2) {
          const input = document.getElementById('kakaoText').value;
          if (input.trim() !== "") {
            document.getElementById('parsedItems').innerText = input;
          }
        }

        // 오래된 문 소리 재생
        door.currentTime = 0;
        door.volume = 0.4;
        door.play().catch(e => {});
      }, 550);
    }
  </script>
</body>
</html>
